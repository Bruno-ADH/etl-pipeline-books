name: CI Pipeline ETL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancement des tests avec couverture
        run: pytest --cov=src --cov-report=xml --cov-fail-under=80
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          LOG_FORMAT: text

      - name: Upload couverture vers Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
        continue-on-error: true

  lint:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installation des outils
        run: pip install flake8

      - name: Vérification syntaxique
        run: flake8 src/ dags/ --max-line-length=100 --ignore=E501,W503
